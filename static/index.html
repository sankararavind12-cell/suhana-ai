  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script>  
   const SUPABASE_URL = "https://jtxsibjspbbcxoefxffr.supabase.co";  
   const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_XNWenU3XsiF56YBg9UEueQ_JQFn8wBG";  
   const supabaseClient = window.supabase.createClient(  
    SUPABASE_URL,  
    SUPABASE_PUBLISHABLE_KEY  
);  
   const $=id=>document.getElementById(id);  
   const authModal = document.getElementById("authModal");  
   const authMessage = document.getElementById("authMessage");  

   function showAuthMessage(message) {
       authMessage.textContent = message;
   }

   async function refreshAuth() {
       const { data, error } = await supabaseClient.auth.getSession();

       if (error) {  
           showAuthMessage("Unable to check your session. Please refresh.");  
           authModal.style.display = "grid";  
           return;  
       }  

       const signedIn = !!data.session;  

       authModal.style.display = signedIn ? "none" : "grid";  
       document.getElementById("signOutBtn").style.display =  
           signedIn ? "inline-block" : "none";  

       if (!signedIn) {  
           showAuthMessage("Sign in to access your personal memory.");  
       }
   }

   document.getElementById("signInBtn").onclick = async () => {
       const email = document.getElementById("authEmail").value.trim();
       const password = document.getElementById("authPassword").value;

       if (!email || !password) {  
           showAuthMessage("Enter your email and password.");  
           return;  
       }

       showAuthMessage("Signing in...");

       const { error } = await supabaseClient.auth.signInWithPassword({  
           email,  
           password  
       });  

       if (error) {  
           showAuthMessage(error.message);  
           return;  
       }  

       await refreshAuth();
   };

   document.getElementById("forgotPasswordBtn").onclick = async () => {
       const email = document.getElementById("authEmail").value.trim();

       if (!email) {  
           showAuthMessage("Enter your email address first.");  
           return;  
       }  

       showAuthMessage("Sending password reset email...");  

       const { error } = await supabaseClient.auth.resetPasswordForEmail(  
           email,  
           {  
               redirectTo: window.location.origin  
           }  
       );  

       if (error) {  
           showAuthMessage(error.message);  
           return;  
       }  

       showAuthMessage(  
           "Password reset email sent! Check your inbox and spam folder."  
       );
   };

   document.getElementById("signUpBtn").onclick = async () => {
       const email = document.getElementById("authEmail").value.trim();
       const password = document.getElementById("authPassword").value;

       if (!email || !password) {  
           showAuthMessage("Enter an email and choose a password.");  
           return;  
       }  

       if (password.length < 6) {  
           showAuthMessage("Use a password with at least 6 characters.");  
           return;  
       }  

       showAuthMessage("Creating your account...");  

       const { data, error } = await supabaseClient.auth.signUp({  
           email,  
           password,  
           options: {  
               emailRedirectTo: window.location.origin  
           }  
       });  

       if (error) {  
           showAuthMessage(error.message);  
           return;  
       }  

       if (data.session) {  
           await refreshAuth();  
       } else {  
           showAuthMessage(  
               "Account created! Check your email for a confirmation link, if required."  
           );  
       }
   };

   document.getElementById("signOutBtn").onclick = async () => {
       showAuthMessage("Signing out...");

       const { error } = await supabaseClient.auth.signOut();  

       if (error) {  
           showAuthMessage(error.message);  
           return;  
       }  

       await refreshAuth();
   };

   supabaseClient.auth.onAuthStateChange(() => {
       refreshAuth();
   });

   refreshAuth();

   const form=$("form"),input=$("input"),messagesEl=$("chatMessages"),statusEl=$("status"),send=$("send");
   let voiceEnabled=true,recognition=null,isListening=false,finalTranscript="";
   let chats=readJSON("suhana_chats",[]);if(!Array.isArray(chats))chats=[];
   const oldHistory=readJSON("suhana_history",[]);
   if(!chats.length)chats.push({id:Date.now().toString(),title:"Previous chat",messages:Array.isArray(oldHistory)?oldHistory:[],updatedAt:Date.now()});
   let activeChatId=localStorage.getItem("suhana_active_chat");
   let activeChat=chats.find(c=>c.id===activeChatId)||chats[0];activeChatId=activeChat.id;
   if(!Array.isArray(activeChat.messages))activeChat.messages=[];
   let history=activeChat.messages;
   let memories=readJSON("suhana_memories",[]);if(!Array.isArray(memories))memories=[];
   
   function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
   function saveChats(){localStorage.setItem("suhana_chats",JSON.stringify(chats));localStorage.setItem("suhana_active_chat",activeChatId);updateMetrics()}
   function saveMemories(){localStorage.setItem("suhana_memories",JSON.stringify(memories));renderMemories();updateMetrics()}
   function updateMetrics(){$("memoryCount").textContent=String(memories.length).padStart(2,"0")+" ITEMS";$("memMeter").style.setProperty("--w",Math.min(100,memories.length*8+8)+"%");$("chatCount").textContent=chats.length+" SESSIONS";$("sessionValue").textContent=String(chats.length).padStart(2,"0");$("sessionMeter").style.setProperty("--w",Math.min(100,chats.length*12+12)+"%");$("activeSession").textContent=activeChat.title.slice(0,16).toUpperCase();$("chatMeter").style.setProperty("--w",Math.min(100,history.length*5+10)+"%")}
   
   function renderMemories() {
       const short = $("memoryList");
       const full = $("fullMemoryList");

       short.replaceChildren();  
       full.replaceChildren();  

       if (!memories.length) {  
           const empty = document.createElement("div");  
           empty.className = "memory-item empty";  
           empty.textContent = "No saved memories yet.";  

           short.append(empty);  
           full.append(empty.cloneNode(true));  
           return;  
       }  

       memories.slice(-4).reverse().forEach(memory => {  
           const item = document.createElement("div");  
           item.className = "memory-item";  
           item.textContent = "◈ " + memory;  
           short.append(item);  
       });  

       memories.forEach((memory, index) => {  
           const row = document.createElement("div");  
           row.className = "history-row";  

           const text = document.createElement("div");  
           text.className = "memory-item";  
           text.style.flex = "1";  
           text.textContent = memory;  

           const del = document.createElement("button");  
           del.className = "hud-btn";  
           del.textContent = "×";  
           del.title = "Delete this memory";  
           del.setAttribute("aria-label", "Delete memory");  

           del.onclick = () => {  
               if (!confirm("Delete this saved memory?\n\n" + memory)) {  
                   return;  
               }  
               memories.splice(index, 1);  
               saveMemories();  
           };  

           row.append(text, del);  
           full.append(row);  
       });
   }

   function addMessage(text,role,isError=false){$("welcomeChat")?.remove();const el=document.createElement("div");el.className="message "+role+(isError?" error":"");el.textContent=text;messagesEl.append(el);messagesEl.scrollTop=messagesEl.scrollHeight;return el}
   function renderMessages(){messagesEl.replaceChildren();if(!history.length){const w=document.createElement("div");w.className="welcome-chat";w.id="welcomeChat";w.innerHTML="<b>CHANNEL OPEN</b>I'm here. Send a message to begin our conversation.<br><span style='color:#397b85'>TEXT // VOICE INPUT // SPOKEN REPLIES</span>";messagesEl.append(w)}else history.forEach(m=>{if(m&&["user","assistant"].includes(m.role)&&typeof m.content==="string")addMessage(m.content,m.role)})}
   function saveMemory(text){const clean=text.trim();if(!clean)return false;memories.push(clean);if(memories.length>50)memories=memories.slice(-50);saveMemories();return true}
   function setStatus(s){statusEl.textContent=s.toUpperCase();$("chatStatus").textContent=s.toUpperCase().slice(0,18)}
   
   function speak(text){if(!voiceEnabled||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-IN";u.rate=.88;u.pitch=1.03;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==="en-IN")||vs.find(v=>v.lang.startsWith("en"))||null;u.onstart=()=>{setStatus("Suhana speaking");$("audioStatus").textContent="VOICE CHANNEL ACTIVE"};u.onend=()=>{if(!isListening)setStatus("System ready");$("audioStatus").textContent=voiceEnabled?"VOICE OUTPUT ENABLED":"VOICE OUTPUT MUTED"};speechSynthesis.speak(u)}
   
   async function sendMessage(raw){
       const clean=raw.trim();
       if(!clean||send.disabled)return;
       addMessage(clean,"user");
       input.value="";
       history.push({role:"user",content:clean});
       activeChat.messages=history;
       
       if(/^remember that\s+/i.test(clean)){
           const memory=clean.replace(/^remember that\s+/i,"").trim();
           if(saveMemory(memory))addMessage("Saved to your local memory bank. 💙","assistant");
           else addMessage("Tell me what you'd like me to remember.","assistant");
           history.push({role:"assistant",content:"Saved to your local memory bank. 💙"});
           saveChats();
           return;
       }
       
       send.disabled=true;
       setStatus("Suhana thinking");
       $("apiStatus").textContent="REQUESTING";
       const wait=addMessage("Establishing secure link…","assistant");
       
       try{
           const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:clean,history:history.slice(-11,-1),memories})});
           const data=await response.json();
           if(!response.ok)throw new Error(data.error||"Request failed");
           const reply=data.reply||"I couldn't create a reply.";
           wait.textContent=reply;
           history.push({role:"assistant",content:reply});
           if(history.length>40)history=history.slice(-40);
           activeChat.messages=history;
           activeChat.updatedAt=Date.now();
           
           if(["New chat","Previous chat"].includes(activeChat.title)){
               const first=history.find(m=>m.role==="user");
               if(first){
                   let title=first.content.replace(/^remember that\s+/i,"").replace(/\s+/g," ").trim();
                   if(title.length>35)title=title.slice(0,32).trimEnd()+"...";
                   activeChat.title=title||"New conversation";
               }
           }
           
           saveChats();
           $("apiStatus").textContent="CONNECTED";
           speak(reply);
           setStatus("System ready");
       }catch(e){
           wait.textContent=(e.message||"Connection failed.")+" — check the Suhana server and try again.";
           wait.classList.add("error");
           $("apiStatus").textContent="OFFLINE";
           setStatus("Connection error");
       }finally{
           send.disabled=false;
           input.focus();
       }
   }

   function startNewChat(){activeChat={id:Date.now().toString(),title:"New chat",messages:[],updatedAt:Date.now()};chats.unshift(activeChat);activeChatId=activeChat.id;history=activeChat.messages;saveChats();renderMessages();setStatus("System ready");if("speechSynthesis"in window)speechSynthesis.cancel();input.value="";input.focus()}
   function renderHistory(){const list=$("historyList");list.replaceChildren();if(!chats.length){list.textContent="No saved conversations.";return}chats.forEach(c=>{const row=document.createElement("div");row.className="history-row";const open=document.createElement("button");open.className="hud-btn";open.textContent=c.title||"New chat";open.onclick=()=>{activeChat=c;activeChatId=c.id;history=activeChat.messages||[];saveChats();renderMessages();$("historyModal").style.display="none";setStatus("System ready")};const del=document.createElement("button");del.className="hud-btn";del.textContent="DELETE";del.style.color="var(--red)";del.onclick=()=>{if(!confirm("Delete this conversation?"))return;chats=chats.filter(x=>x.id!==c.id);if(!chats.length)chats.push({id:Date.now().toString(),title:"New chat",messages:[],updatedAt:Date.now()});if(activeChatId===c.id){activeChat=chats[0];activeChatId=activeChat.id;history=activeChat.messages||[];renderMessages()}saveChats();renderHistory()};row.append(open,del);list.append(row)})}
   
   $("newChat").onclick=startNewChat;
   $("historyButton").onclick=()=>{renderHistory();$("historyModal").style.display="grid"};
   $("closeHistory").onclick=()=>$("historyModal").style.display="none";
   $("deleteAll").onclick=()=>{if(!confirm("Delete all chat history? Memories will stay saved."))return;chats=[{id:Date.now().toString(),title:"New chat",messages:[],updatedAt:Date.now()}];activeChat=chats[0];activeChatId=activeChat.id;history=activeChat.messages;saveChats();renderMessages();renderHistory()};
   $("focusChat").onclick=()=>{ $("chatPanel").scrollIntoView({behavior:"smooth",block:"center"});input.focus()};
   $("toggleVoice").onclick=()=>{voiceEnabled=!voiceEnabled;$("voiceIcon").textContent=voiceEnabled?"◖))":"MUTE";$("voice").textContent=voiceEnabled?"◖))":"×";$("audioStatus").textContent=voiceEnabled?"VOICE OUTPUT ENABLED":"VOICE OUTPUT MUTED";if(!voiceEnabled&&"speechSynthesis"in window)speechSynthesis.cancel()};
   $("voice").onclick=()=>{$("toggleVoice").click()};
   $("playTest").onclick=()=>speak("Suhana interface online. I'm listening.");
   $("stopAudio").onclick=()=>{if("speechSynthesis"in window)speechSynthesis.cancel();$("audioStatus").textContent="AUDIO STOPPED"};
   $("clearChat").onclick=()=>{if(!confirm("Clear this conversation? Other saved sessions and memories will remain."))return;history=[];activeChat.messages=history;activeChat.updatedAt=Date.now();saveChats();renderMessages()};
   $("openMemories").onclick=()=>$("memoryModal").style.display="grid";
   $("closeMemory").onclick=()=>$("memoryModal").style.display="none";
   $("clearMemories").onclick=()=>{if(!confirm("Erase all saved memories from this browser?"))return;memories=[];saveMemories()};
   
   $("weatherButton").onclick=async()=>{
       const b=$("weatherButton");
       b.disabled=true;
       b.textContent="LOADING…";
       try{
           const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=9.98&longitude=76.28&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=4&timezone=Asia%2FKolkata");
           if(!r.ok)throw Error("Weather unavailable");
           const d=await r.json();
           const c=d.current;
           $("temp").textContent=Math.round(c.temperature_2m)+"°C";
           const desc=weatherName(c.weather_code);
           $("weatherNote").textContent=desc+" · Feels "+Math.round(c.apparent_temperature)+"°C · Humidity "+c.relative_humidity_2m+"%";
           $("weatherIcon").textContent=weatherIcon(c.weather_code);
           const f=document.querySelectorAll(".forecast div");
           f.forEach((el,i)=>{el.innerHTML=(i===0?"TODAY":i===1?"TOMORROW":new Date(d.daily.time[i]+"T12:00:00").toLocaleDateString("en",{weekday:"short"}))+"<b>"+weatherIcon(d.daily.weather_code[i])+"</b><span>"+Math.round(d.daily.temperature_2m_max[i])+"° / "+Math.round(d.daily.temperature_2m_min[i])+"°</span>"});
           b.textContent="REFRESH WEATHER";
       }catch(e){
           $("weatherNote").textContent="Could not load weather. Check internet and retry.";
           b.textContent="TRY AGAIN";
       }finally{
           b.disabled=false;
       }
   };

   function weatherName(c){if(c===0)return"Clear sky";if([1,2,3].includes(c))return"Partly cloudy";if([45,48].includes(c))return"Fog";if([51,53,55,56,57].includes(c))return"Drizzle";if([61,63,65,66,67,80,81,82].includes(c))return"Rain";if([71,73,75,77,85,86].includes(c))return"Snow";if([95,96,99].includes(c))return"Thunderstorm";return"Current conditions"}
   function weatherIcon(c){if(c===0)return"☀";if([1,2,3,45,48].includes(c))return"☁";if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))return"☂";if([95,96,99].includes(c))return"ϟ";return"◉"}

   const SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(SpeechAPI){
       recognition=new SpeechAPI();
       recognition.lang="en-IN";
       recognition.continuous=false;
       recognition.interimResults=true;
       recognition.onstart=()=>{isListening=true;finalTranscript="";input.value="";$("mic").textContent="■";setStatus("Listening")};
       recognition.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalTranscript+=t+" ";else interim+=t}input.value=(finalTranscript+interim).trim()};
       recognition.onerror=e=>setStatus(e.error==="not-allowed"?"Allow microphone access":"Microphone "+e.error);
       recognition.onend=()=>{isListening=false;$("mic").textContent="🎙";const t=finalTranscript.trim();if(t){input.value=t;sendMessage(t)}else setStatus("System ready")};
       $("mic").onclick=()=>{if(isListening)recognition.stop();else try{speechSynthesis?.cancel();recognition.start()}catch{setStatus("Try microphone again")}};
   }else{
       $("mic").onclick=()=>setStatus("Voice input not supported in this browser");
   }

   form.addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value)});
   input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
   
   function updateClock(){const now=new Date();const t=now.toLocaleTimeString("en-GB",{hour12:false});$("topClock").textContent=t;$("mainClock").textContent=t;$("topDate").textContent=now.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}).toUpperCase();$("mainDate").textContent=now.toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).toUpperCase()}
   function bars(id,count){const el=$(id);for(let i=0;i<count;i++){const b=document.createElement("i");b.style.setProperty("--h",(12+Math.random()*85)+"%");b.style.setProperty("--d",(Math.random()*1.2)+"s");el.append(b)}}
   
   bars("wave",38);bars("audioWave",28);bars("activityGraph",36);
   setInterval(()=>{updateClock();document.querySelectorAll("#activityGraph i").forEach(b=>b.style.height=(8+Math.random()*90)+"%");$("activityValue").textContent=(35+Math.floor(Math.random()*55))+"%"},1000);
   
   $("screenInfo").textContent=window.innerWidth+"×"+window.innerHeight;
   $("browserInfo").textContent=/Android/i.test(navigator.userAgent)?"ANDROID":/iPhone|iPad/i.test(navigator.userAgent)?"IOS":"DESKTOP";
   $("storageInfo").textContent=(()=>{try{localStorage.setItem("_test","1");localStorage.removeItem("_test");return"AVAILABLE"}catch{return"BLOCKED"}})();
   
   updateClock();renderMemories();updateMetrics();renderMessages();
   
   if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
  </script>
