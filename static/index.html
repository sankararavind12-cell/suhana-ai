<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <meta name="description" content="Meet Suhana, your personal AI assistant.">

  <link rel="manifest" href="/manifest.webmanifest">

  <title>Suhana AI</title>

  <style>
        /* Suhana UI Upgrade */
    body {
      background: #0d0f14;
      background-image:
        radial-gradient(ellipse at top, #202039 0%, #0d0f14 55%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px 18px;
      background: rgba(17, 19, 29, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .avatar {
      border-radius: 50%;
      background: linear-gradient(135deg, #c4b5fd, #818cf8);
      box-shadow: 0 0 24px rgba(167, 139, 250, 0.2);
    }

    main {
      width: 100%;
      max-width: 820px;
      padding: 28px 18px 36px;
      gap: 20px;
    }

    .welcome {
      margin: auto 0;
      padding: 55px 10px;
    }

    .welcome .symbol {
      display: inline-grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 26px;
      background: linear-gradient(135deg, #c4b5fd, #818cf8);
      color: #111323;
      box-shadow: 0 12px 40px rgba(129, 140, 248, 0.18);
    }

    .welcome h2 {
      font-size: clamp(25px, 5vw, 34px);
      letter-spacing: -0.8px;
    }

    .message {
      max-width: 90%;
      padding: 14px 17px;
      border-radius: 20px;
      line-height: 1.7;
      animation: messageIn 0.2s ease-out;
    }

    .user {
      background: linear-gradient(135deg, #7466d9, #6554c0);
      border-bottom-right-radius: 6px;
    }

    .assistant {
      background: rgba(31, 35, 49, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 6px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      z-index: 5;
      padding: 14px 12px max(14px, env(safe-area-inset-bottom));
      background: rgba(13, 15, 20, 0.94);
      backdrop-filter: blur(18px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    form {
      padding: 7px;
      border: 1px solid #36394e;
      border-radius: 23px;
      background: #191c27;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }

    textarea {
      border: none;
      background: transparent;
      min-height: 46px;
    }

    textarea:focus {
      border: none;
    }

    button {
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.94);
    }

    #mic,
    #voice {
      background: #292d3d;
      color: #e4e5f5;
      font-size: 17px;
    }

    #send {
      min-width: 46px;
      border-radius: 17px;
      background: #b8aaff;
    }

    .hint {
      max-width: 760px;
      margin: 10px auto 0;
      line-height: 1.5;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 12px 14px;
      }

      main {
        padding: 20px 12px 28px;
      }

      .message {
        max-width: 94%;
        padding: 12px 14px;
      }

      .composer {
        padding-left: 8px;
        padding-right: 8px;
      }

      form {
        gap: 5px;
      }

      button {
        min-width: 42px;
      }
    }
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #10131f;
      color: #f4f5ff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #171b2a;
      border-bottom: 1px solid #292e42;
    }

    .avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #10131f;
      font-size: 24px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      margin-top: 3px;
      font-size: 12px;
      color: #9ba5bc;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      margin: 30px 0 15px;
    }

    .welcome .symbol {
      font-size: 42px;
    }

    .welcome h2 {
      margin: 10px 0 8px;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      color: #9ba5bc;
      line-height: 1.6;
    }

    .message {
      max-width: 88%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #7663db;
      border-bottom-right-radius: 5px;
    }

    .assistant {
      align-self: flex-start;
      background: #20263a;
      border: 1px solid #303750;
      border-bottom-left-radius: 5px;
    }
    /* Suhana's typing animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 48px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b8aaff;
      animation: typingBounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-indicator span {
        animation: none;
      }
    }
    .error {
      color: #ffaaaa;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px;
      background: #10131f;
      border-top: 1px solid #292e42;
    }

    form {
      max-width: 760px;
      margin: auto;
      display: flex;
      gap: 9px;
      align-items: center;
    }

    textarea {
      flex: 1;
      resize: none;
      min-width: 0;
      height: 48px;
      max-height: 120px;
      padding: 13px 15px;
      border: 1px solid #343b55;
      border-radius: 16px;
      background: #1b2031;
      color: white;
      font: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #9a89ff;
    }

    button {
      height: 46px;
      min-width: 48px;
      border: 0;
      border-radius: 15px;
      background: #a99aff;
      color: #111323;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .hint {
      text-align: center;
      color: #737e98;
      font-size: 11px;
      margin-top: 9px;
    }
  </style>
</head>

<body>
  <header>
    <div class="avatar">S</div>

    <div>
      <h1>Suhana</h1>
      <div class="status" id="status">
        Your personal AI assistant
      </div>
    </div>
  </header>

  <main id="chat">
    <section class="welcome" id="welcome">
      <div class="symbol">✦</div>
      <h2>Hey, I'm Suhana.</h2>
      <p>
        Your personal AI companion.<br>
        What's on your mind today?
      </p>
    </section>
  </main>

  <section class="composer">
    <form id="form">
      <textarea
        id="input"
        placeholder="Message Suhana..."
        rows="1"
        maxlength="8000"
        aria-label="Your message"
        required
      ></textarea>

      <button
        id="voice"
        type="button"
        aria-label="Toggle Suhana voice"
      >🔊</button>

      <button
        id="mic"
        type="button"
        aria-label="Speak your message"
      >🎙️</button>

      <button
        id="send"
        type="submit"
        aria-label="Send message"
      >↑</button>
    </form>

    <div class="hint">
      Suhana AI · Your conversations are sent to the AI service to generate replies.
    </div>
  </section>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const statusText = document.getElementById("status");
    const voiceButton = document.getElementById("voice");
    const micButton = document.getElementById("mic");
    const welcome = document.getElementById("welcome");
    const send = document.getElementById("send");

    let suhanaVoiceEnabled = true;
    let recognition = null;
    let finalTranscript = "";
    let isListening = false;

    const history = [];

    // Toggle Suhana's spoken replies.
    voiceButton.addEventListener("click", () => {
      suhanaVoiceEnabled = !suhanaVoiceEnabled;

      voiceButton.textContent =
        suhanaVoiceEnabled ? "🔊" : "🔇";

      if (
        !suhanaVoiceEnabled &&
        "speechSynthesis" in window
      ) {
        window.speechSynthesis.cancel();
      }
    });

    // Speak Suhana's response aloud.
    function speakSuhana(text) {
      if (
        !suhanaVoiceEnabled ||
        !("speechSynthesis" in window)
      ) {
        return;
      }

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "en-IN";
      speech.rate = 1;
      speech.pitch = 1.05;
      speech.volume = 1;

      const voices = window.speechSynthesis.getVoices();

      const preferredVoice =
        voices.find(voice => voice.lang === "en-IN") ||
        voices.find(voice => voice.lang.startsWith("en"));

      if (preferredVoice) {
        speech.voice = preferredVoice;
      }

      speech.onstart = () => {
        statusText.textContent = "Suhana is speaking...";
      };

      speech.onend = () => {
        if (!isListening) {
          statusText.textContent =
            "Your personal AI assistant";
        }
      };

      speech.onerror = (event) => {
        statusText.textContent = "Voice playback unavailable";
        console.log("Suhana voice error:", event.error);
      };

      window.speechSynthesis.speak(speech);
    }

    // Add a message to the chat.
    function addMessage(text, role, isError = false) {
      welcome?.remove();

      const bubble = document.createElement("div");

      bubble.className =
        "message " + role + (isError ? " error" : "");

      bubble.textContent = text;

      chat.appendChild(bubble);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return bubble;
    }

    // Send a message to the AI backend.
    async function sendMessage(message) {
      const cleanMessage = message.trim();

      if (!cleanMessage || send.disabled) {
        return;
      }

      addMessage(cleanMessage, "user");

      input.value = "";
      send.disabled = true;

      statusText.textContent = "Suhana is thinking...";

            const waiting = addMessage("", "assistant");
      waiting.classList.add("typing-indicator");
      waiting.setAttribute("aria-label", "Suhana is thinking");

      waiting.innerHTML = "<span></span><span></span><span></span>";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: cleanMessage,
            history: history.slice(-10)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Something went wrong."
          );
        }

        const reply =
          data.reply || "I couldn't create a reply.";

        waiting.textContent = reply;

        speakSuhana(reply);

        history.push(
          {
            role: "user",
            content: cleanMessage
          },
          {
            role: "assistant",
            content: reply
          }
        );

        if (history.length > 20) {
          history.splice(0, history.length - 20);
        }

        statusText.textContent =
          "Your personal AI assistant";

      } catch (error) {
        waiting.textContent =
          (error.message || "Connection failed.") +
          " Please check the server setup and try again.";

        waiting.classList.add("error");

        statusText.textContent = "Connection needs attention";

      } finally {
        send.disabled = false;

        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      }
    }

    // Microphone and speech recognition.
    const SpeechRecognitionAPI =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognitionAPI) {
      recognition = new SpeechRecognitionAPI();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        finalTranscript = "";

        input.value = "";

        micButton.textContent = "🛑";
        statusText.textContent = "Suhana is listening...";
      };

      recognition.onresult = (event) => {
        let interimTranscript = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {
          const spokenText =
            event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            finalTranscript += spokenText + " ";
          } else {
            interimTranscript += spokenText;
          }
        }

        input.value =
          (finalTranscript + interimTranscript).trim();
      };

      recognition.onerror = (event) => {
        console.error(
          "Suhana microphone error:",
          event.error
        );

        if (event.error === "not-allowed") {
          statusText.textContent =
            "Please allow microphone access in your browser.";
        } else if (event.error === "no-speech") {
          statusText.textContent =
            "I didn't hear anything. Please try again.";
        } else if (event.error === "audio-capture") {
          statusText.textContent =
            "No working microphone was found.";
        } else {
          statusText.textContent =
            "Microphone error: " + event.error;
        }
      };

      recognition.onend = () => {
        isListening = false;
        micButton.textContent = "🎙️";

        const message = finalTranscript.trim();

        if (message) {
          input.value = message;

          statusText.textContent = "Sending your message...";

          if (!send.disabled) {
            setTimeout(() => {
              sendMessage(message);
            }, 300);
          }
        } else {
          if (
            statusText.textContent ===
            "Suhana is listening..."
          ) {
            statusText.textContent =
              "Your personal AI assistant";
          }
        }
      };

      // This click handler was missing in your original code.
      micButton.addEventListener("click", () => {
        if (isListening) {
          recognition.stop();
          return;
        }

        try {
          finalTranscript = "";

          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }

          recognition.start();

        } catch (error) {
          console.error(
            "Could not start microphone:",
            error
          );

          statusText.textContent =
            "Please try the microphone again.";
        }
      });

    } else {
      micButton.addEventListener("click", () => {
        statusText.textContent =
          "Speech recognition isn't supported in this browser.";
      });
    }

    // Send typed messages.
    form.addEventListener("submit", event => {
      event.preventDefault();

      const message = input.value.trim();

      if (message && !send.disabled) {
        sendMessage(message);
      }
    });

    // Enter sends; Shift + Enter creates a new line.
    input.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    // Register the PWA service worker.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/sw.js")
          .catch(error => {
            console.error(
              "Service worker:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
